[package]
name = "craftbuddy-engine"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM MCTS policy engine for AFNM CraftBuddy"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
