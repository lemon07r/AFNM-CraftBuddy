name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package version
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Build WASM engine
        run: bun run wasm:build

      - name: Release gate
        run: bun run release:validate && bun run wasm:test

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: AFNM-CraftBuddy v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            builds/afnm-craftbuddy.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
